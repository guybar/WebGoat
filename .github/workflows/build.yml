name: "Main / Pull requests build"
on:
    pull_request:
        paths-ignore:
            - '.txt'
            - 'LICENSE'
            - 'docs/**'
        branches: [ main ]
    push:
        branches:
            - main

permissions:
  # This is required for requesting the OIDC token
  id-token: write
  # This is required for actions/checkout
  contents: read

jobs:
    pre-commit:
        name: Pre-commit check
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout git repository
                uses: actions/checkout@v4.1.6
            -   name: Setup python
                uses: actions/setup-python@v5
                with:
                    python-version: "3.9"
            -   uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: '23'
            -   name: Pre-commit checks
                uses: pre-commit/action@v3.0.1
            -   name: pre-commit-c-lite
                uses: pre-commit-ci/lite-action@v1.1.0
                if: always()
    build:
        runs-on: ubuntu-latest
        needs: [ pre-commit ]
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up JDK 23
                uses: actions/setup-java@v4.2.1
                with:
                    distribution: 'temurin'
                    java-version: 23
                    architecture: x64
                    cache: 'maven'
            -   name: Setup JFrog CLI
                uses: jfrog/setup-jfrog-cli@v4
                env:
                  # JFrog platform url (for example: https://acme.jfrog.io)
                  JF_URL: ${{ vars.JF_URL }}
                with:
                  # Name of the OIDC provider as specified on the OIDC integration page in the JFrog Platform
                  oidc-provider-name: setup-jfrog-cli
                  
            -   name: Build with JFrog CLI
                run: |
                  # Ping the server
                  jf rt ping
                  # configure and run maven build
                  jf mvnc --repo-resolve-snapshots web-goat-demo-docker-dev --repo-deploy-snapshots web-goat-demo-docker-dev
                  jf mvn clean build
                  # Collect environment variables for the build
                  jf rt bce
                  # Collect VCS details from git and add them to the build
                  jf rt bag
                  # Publish build info
                  jf rt bp
